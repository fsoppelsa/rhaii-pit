---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-demo

---
# 3 replicas of the vLLM simulator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-simulator
  namespace: llm-d-demo
  labels:
    app: vllm-sim
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vllm-sim
  template:
    metadata:
      labels:
        app: vllm-sim
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: vllm-sim
          # NB: v0.2.0 takes --inter-token-latency in milliseconds (int),
          # NOT a Go duration. The upstream manifest used "60ms" => pod
          # in CrashLoopBackOff.
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.2.0
          args:
            - "--port=8000"
            - "--model=meta-llama/Llama-3.1-8B-Instruct"
            - "--mode=echo"
            - "--inter-token-latency=200"
            - "--max-num-seqs=1"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"

---
# ClusterIP Service for internal communication
apiVersion: v1
kind: Service
metadata:
  name: vllm-sim-service
  namespace: llm-d-demo
spec:
  type: ClusterIP
  selector:
    app: vllm-sim
  ports:
    - port: 8000
      targetPort: 8000
      name: http

---
# NodePort for direct access during the demo
apiVersion: v1
kind: Service
metadata:
  name: vllm-sim-nodeport
  namespace: llm-d-demo
spec:
  type: NodePort
  selector:
    app: vllm-sim
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 31800
      name: http
