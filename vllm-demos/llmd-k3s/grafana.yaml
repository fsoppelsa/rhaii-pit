---
# Grafana — provisioned with a Prometheus datasource and a live dashboard
# for the llm-d routing demo. Prometheus is already deployed by prometheus.yaml
# and scrapes the vllm-simulator pods' /metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: llm-d-demo
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.llm-d-demo.svc:9090
        isDefault: true
        editable: false

---
# Dashboard *provider*: tells Grafana to auto-load JSON files from
# /var/lib/grafana/dashboards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: llm-d-demo
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: llm-d
        orgId: 1
        folder: "llm-d"
        type: file
        disableDeletion: true
        updateIntervalSeconds: 10
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards

---
# The actual dashboard JSON.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: llm-d-demo
data:
  llm-d-routing.json: |
    {
      "title": "llm-d — Inference Routing",
      "uid": "llmd-routing",
      "time": { "from": "now-5m", "to": "now" },
      "refresh": "2s",
      "schemaVersion": 39,
      "tags": ["llm-d", "vllm"],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests running per pod",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "vllm:num_requests_running",
              "legendFormat": "{{pod}} running",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Requests waiting per pod",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "vllm:num_requests_waiting",
              "legendFormat": "{{pod}} waiting",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Total in-flight per pod (running + waiting)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "vllm:num_requests_running + vllm:num_requests_waiting",
              "legendFormat": "{{pod}} total",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "GPU cache usage per pod",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "vllm:gpu_cache_usage_perc",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 },
            "overrides": []
          }
        }
      ]
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: llm-d-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_USERS_DEFAULT_THEME
              value: "dark"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: llm-d-demo
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31901
      name: http
